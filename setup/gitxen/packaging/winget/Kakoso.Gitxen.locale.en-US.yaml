ShortDescription: A git client for Windows, built with WinUI 3.
Description: >-
  Gitxen is a free, open-source git client for Windows with a WinUI 3 interface: staged and unstaged
  changes with hunk-level staging, a commit graph with ref badges and search, branches, remotes,
  tags, stashes, submodules, worktrees, reflog recovery and conflict resolution, with several
  repositories open at once as tabs. It is a derivative work of Git Extensions, distributed under
  the same GPL-3.0 licence, and is not endorsed by or affiliated with that project.
